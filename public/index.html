<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ship's Bell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="icons/icon.png" />
  <style>
    :root {
      --navy: #041f50;
      --navy-light: #0b2e6b;
      --gold: #ecaa25;
      --gold-dim: #b98419;
    }
    body {
      font-family: system-ui, sans-serif;
      max-width: 480px;
      margin: 2rem auto;
      padding: 0 1rem 2rem;
      color: #f2e9d8;
      background: var(--navy);
      min-height: 100vh;
    }
    h1 {
      font-size: 1.25rem;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    h1 img {
      width: 32px;
      height: 32px;
    }
    #status {
      font-size: 0.9rem;
      color: #b9c3d9;
      margin-bottom: 1rem;
    }
    #last-strike {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--gold);
    }
    button {
      font-size: 1rem;
      padding: 0.5rem 1rem;
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: var(--gold-dim);
    }
    #controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1rem 0;
      background: var(--navy-light);
      padding: 0.75rem 1rem;
      border-radius: 8px;
    }
    #controls label {
      font-size: 0.9rem;
      color: #b9c3d9;
    }
    #volume {
      flex: 1;
      accent-color: var(--gold);
    }
    #mute-button {
      font-size: 0.9rem;
      padding: 0.35rem 0.7rem;
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
    }
    #mute-button[aria-pressed="true"] {
      background: var(--gold);
      color: var(--navy);
    }
    #schedule-control {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 1rem 0;
      background: var(--navy-light);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      flex-wrap: wrap;
    }
    #schedule-control label {
      font-size: 0.9rem;
      color: #b9c3d9;
    }
    #schedule-select {
      flex: 1;
      min-width: 140px;
      background: var(--navy);
      color: #f2e9d8;
      border: 1px solid var(--gold-dim);
      border-radius: 6px;
      padding: 0.4rem 0.5rem;
      font-size: 0.9rem;
    }
    #schedule-status {
      font-size: 0.8rem;
      color: #b9c3d9;
    }
    #mopidy-zones-control {
      margin: 1rem 0;
      background: var(--navy-light);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      display: none;
    }
    #mopidy-zones-control legend {
      font-size: 0.9rem;
      color: #b9c3d9;
      padding: 0;
    }
    #mopidy-zones-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    #mopidy-zones-list label {
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    #mopidy-zones-status {
      font-size: 0.8rem;
      color: #b9c3d9;
      margin-top: 0.4rem;
    }
    #bell-times-details {
      margin: 1rem 0;
      background: var(--navy-light);
      padding: 0.75rem 1rem;
      border-radius: 8px;
    }
    #bell-times-details summary {
      font-size: 0.9rem;
      color: var(--gold);
      cursor: pointer;
    }
    #bell-times-status {
      font-size: 0.8rem;
      color: #b9c3d9;
      margin-top: 0.5rem;
    }
    #bell-times-table {
      width: 100%;
      margin-top: 0.6rem;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    #bell-times-table th {
      text-align: left;
      color: #b9c3d9;
      font-weight: 600;
      padding: 0.3rem 0.4rem;
      border-bottom: 1px solid var(--gold-dim);
    }
    #bell-times-table td {
      padding: 0.25rem 0.4rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      vertical-align: top;
    }
    #bell-times-table td.watch-name {
      color: var(--gold-dim);
      white-space: nowrap;
    }
    #bell-times-table td.bells {
      letter-spacing: 0.15em;
    }
    #bell-times-table tr.current-row td {
      background: rgba(236, 170, 37, 0.18);
      color: #fff;
    }
    #bell-times-table tr.current-row td.watch-name {
      color: var(--gold);
    }
  </style>
</head>
<body>
  <h1><img src="icons/icon.png" alt="" /> Ship's Bell</h1>
  <div id="status">Connecting...</div>
  <div id="last-strike">No strikes yet this session.</div>
  <div id="controls">
    <label for="volume">Volume</label>
    <input type="range" id="volume" min="0" max="100" value="80" />
    <button id="mute-button" aria-pressed="false">Mute</button>
  </div>
  <div id="schedule-control">
    <label for="schedule-select">Watch bell schedule</label>
    <select id="schedule-select" disabled>
      <option>Loading...</option>
    </select>
    <span id="schedule-status"></span>
  </div>
  <fieldset id="mopidy-zones-control">
    <legend>Play bells in (Mopidy sound server playback method only; none selected = every zone)</legend>
    <div id="mopidy-zones-list"></div>
    <div id="mopidy-zones-status"></div>
  </fieldset>
  <details id="bell-times-details">
    <summary>Bell schedule reference</summary>
    <div id="bell-times-status"></div>
    <table id="bell-times-table">
      <thead>
        <tr><th>Watch</th><th>Time</th><th>Bells</th></tr>
      </thead>
      <tbody id="bell-times-body"></tbody>
    </table>
  </details>
  <button id="test-button">Play test bell (8 bells)</button>
  <audio id="bell-audio"></audio>
  <script src="app.js"></script>
</body>
</html>
